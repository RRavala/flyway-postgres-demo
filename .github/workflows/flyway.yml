name: Flyway migrate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: demo
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/demo
      FLYWAY_USER: demo
      FLYWAY_PASSWORD: demo
    steps:
      - uses: actions/checkout@v4

      - name: Flyway info (before)
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            redgate/flyway info

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            redgate/flyway migrate

      - name: Validate applied migrations
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            redgate/flyway validate

      - name: Flyway info (after)
        run: |
          docker run --rm --network host \
            -v ${{ github.workspace }}/sql:/flyway/sql \
            -v ${{ github.workspace }}/flyway.conf:/flyway/conf/flyway.conf \
            -e FLYWAY_URL -e FLYWAY_USER -e FLYWAY_PASSWORD \
            redgate/flyway info
